[project]
name = "weatheragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "negishubham2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "groq>=1.7.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
]

[project.scripts]
weatheragent = "weatheragent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Add this line to disable package building:
[tool.hatch.build.targets.wheel]
bypass-selection = true
